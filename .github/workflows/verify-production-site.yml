name: Verify production site

on:
  workflow_run:
    workflows: ["Deploy production site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify deployed custom domain
        id: smoke
        continue-on-error: true
        env:
          SITE_ORIGIN: https://vishal.novapharmhealthcare.com
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail
          report=/tmp/production-verification.md
          cache_key="release-${RELEASE_SHA}-$(date +%s)"
          success=false

          for attempt in $(seq 1 72); do
            home=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${SITE_ORIGIN}/?${cache_key}-${attempt}" || true)
            if grep -Fq 'Building a UK-led pharmaceutical company around market access' <<<"$home" \
              && grep -Fq 'data-hubble-hero' <<<"$home" \
              && grep -Fq 'data-real-cosmos' <<<"$home" \
              && grep -Fq 'assets.science.nasa.gov/dynamicimage/assets/science/missions/hubble/' <<<"$home" \
              && ! grep -Fq 'id="nova-field"' <<<"$home" \
              && grep -Fq 'Pharmaceutical essays' <<<"$home" \
              && ! grep -Fq 'Ask Vishal’s Work' <<<"$home" \
              && ! grep -Fq 'href="/gallery/"' <<<"$home"; then
              success=true
              break
            fi
            sleep 10
          done

          if [[ "$success" != true ]]; then
            cat > "$report" <<EOF
          ## Production verification failed

          The Pages workflow completed, but the custom domain did not serve the new founder homepage within the 12-minute verification window.

          Release: \`${RELEASE_SHA}\`
          EOF
            exit 1
          fi

          about=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/about/?${cache_key}")
          ventures=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/ventures/?${cache_key}")
          thinking=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/thinking/?${cache_key}")
          media=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/media/?${cache_key}")
          contact=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/contact/?${cache_key}")
          cornerstone=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/essays/regulatory-approval-is-not-market-access/?${cache_key}")
          founder=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/essays/why-i-chose-to-build-in-pharmaceuticals/?${cache_key}")
          retired=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/essays/why-i-left-swiggy/?${cache_key}")
          profile=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/facts/?${cache_key}")
          gallery=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/gallery/?${cache_key}")
          sitemap=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/sitemap.xml?${cache_key}")
          content_index=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/content-index.json?${cache_key}")
          llms=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${SITE_ORIGIN}/llms.txt?${cache_key}")

          grep -Fq 'data-page-cosmic-hero' <<<"$about"
          grep -Fq 'STScI-01EVT8DP1YM9FYPF0Y33VY7ANB.tif' <<<"$about"
          grep -Fq 'about-hero-portrait' <<<"$about"
          grep -Fq 'vishal-chakravarty-960.webp' <<<"$about"
          grep -Fq 'Hubble · NGC 1300 · NASA/ESA · Hubble Heritage Team' <<<"$about"
          grep -Fq 'Explore the work' <<<"$about"
          grep -Fq 'assets/unified-system.css' <<<"$about"
          grep -Fq 'page-section-index' <<<"$about"

          grep -Fq 'data-page-cosmic-hero' <<<"$ventures"
          grep -Fq 'STScI-01GA6KKWG229B16K4Q38CH3BXS.png' <<<"$ventures"
          grep -Fq 'Webb · Cosmic Cliffs · NASA/ESA/CSA/STScI' <<<"$ventures"
          grep -Fq 'Ventures / 01 · NovaPharm Healthcare' <<<"$ventures"
          grep -Fq 'Explore NovaPharm' <<<"$ventures"
          grep -Fq 'One route. Connected decisions.' <<<"$ventures"
          grep -Fq 'route-summary' <<<"$ventures"

          grep -Fq '10 essays' <<<"$thinking"
          grep -Fq 'data-page-cosmic-hero' <<<"$thinking"
          grep -Fq 'STScI-01EVVM9R75RVTEHV4R6SDT34D3.tif' <<<"$thinking"
          grep -Fq 'Hubble · Ultra Deep Field · NASA/ESA · HUDF Team/STScI' <<<"$thinking"

          grep -Fq 'data-page-cosmic-hero' <<<"$media"
          grep -Fq 'STScI-01GFRYYRTCTMX197BY86MBFCR9.png' <<<"$media"
          grep -Fq 'Webb · Pillars of Creation · NASA/ESA/CSA/STScI' <<<"$media"

          grep -Fq 'data-page-cosmic-hero' <<<"$contact"
          grep -Fq '324350main_11_full-1.jpg' <<<"$contact"
          grep -Fq 'Earth at Night · NASA/NOAA' <<<"$contact"
          grep -Fq 'Regulatory Approval Is Not Market Access' <<<"$cornerstone"
          grep -Fq 'Why I Chose to Build in Pharmaceuticals' <<<"$founder"
          grep -Fq 'noindex,follow' <<<"$retired"
          grep -Fq '/essays/why-i-chose-to-build-in-pharmaceuticals/' <<<"$retired"
          if grep -Fq 'The Story Was Too Simple' <<<"$retired"; then
            echo 'Retired essay title was exposed in production' >&2
            exit 1
          fi
          grep -Fq 'Founder Profile' <<<"$profile"
          grep -Fq 'data-page-cosmic-hero' <<<"$profile"
          grep -Fq 'STScI-01G8H15R2PGEXQD7TYYBFJ3FT4.png' <<<"$profile"
          grep -Fq 'Webb · First Deep Field · NASA/ESA/CSA/STScI' <<<"$profile"
          if grep -Fq 'Machine-readable fact record' <<<"$profile"; then
            echo 'Machine-facing copy was exposed on the founder profile' >&2
            exit 1
          fi
          grep -Fq 'noindex,follow' <<<"$gallery"
          grep -Fq 'This page has moved.' <<<"$gallery"
          grep -Fq 'href="/about/"' <<<"$gallery"
          grep -Fq '<meta http-equiv="refresh" content="0; url=/about/">' <<<"$gallery"
          if grep -Fq '/gallery/' <<<"$sitemap"; then
            echo 'Retired gallery route appeared in the sitemap' >&2
            exit 1
          fi
          grep -Fq '/essays/regulatory-approval-is-not-market-access/' <<<"$sitemap"
          grep -Fq '"schemaVersion": 1' <<<"$content_index"
          grep -Fq '"publisher"' <<<"$content_index"
          grep -Fq 'Structured public content index' <<<"$home"
          grep -Fq 'Structured content index' <<<"$llms"
          if grep -Fq '/essays/why-i-left-swiggy/' <<<"$sitemap"; then
            echo 'Retired essay route appeared in the sitemap' >&2
            exit 1
          fi
          [[ $(grep -o '<image:image>' <<<"$sitemap" | wc -l | tr -d ' ') == 1 ]]
          grep -Fq '/images/portrait/vishal-chakravarty-1440.webp' <<<"$sitemap"

          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            "${SITE_ORIGIN}/images/portrait/vishal-chakravarty-1440.webp?${cache_key}" \
            --output /dev/null

          founder_ai_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "${SITE_ORIGIN}/assets/founder-ai.js?${cache_key}")
          [[ "$founder_ai_status" == "404" ]]

          cat > "$report" <<EOF
          ## Production site verified

          The refined founder portfolio is live on the custom domain.

          - Homepage: new pharmaceutical founder proposition served
          - Thinking: 10 public essays served
          - Cornerstone market-access essay: served and indexable
          - Founder-origin essay: served and indexable
          - Retired essay route: neutral \`noindex,follow\` compatibility page
          - Profile: human-facing copy served without machine-record promotion
          - Homepage: real NASA/ESA Hubble Supernova 1987A hero served with cinematic camera motion
          - Homepage: retired procedural Nova canvas and founder AI interface are absent
          - About: founder-first Hubble NGC 1300 hero served with the canonical portrait
          - Unified system: shared Apple/OpenAI/NASA/SpaceX-inspired UI and editorial hierarchy served
          - Structured publishing: content-index.json and llms.txt served
          - Ventures: Webb Cosmic Cliffs hero served with the focused NovaPharm action
          - Thinking: Hubble Ultra Deep Field hero served from the official NASA asset host
          - Media: Webb Pillars of Creation MIRI hero served from the official NASA asset host
          - Profile: Webb First Deep Field hero served from the official NASA asset host
          - Contact: NASA Earth at Night hero served from the official NASA asset host
          - Gallery: retired route serves noindex,follow with a destination canonical and instant redirect to About
          - Portrait asset: high-resolution official WebP served
          - Sitemap: cornerstone route included; retired essay and gallery routes excluded
          - Image sitemap: canonical founder portrait included

          Release: \`${RELEASE_SHA}\`
          Verified: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

      - name: Record verification summary
        if: always()
        run: |
          if [[ -f /tmp/production-verification.md ]]; then
            cat /tmp/production-verification.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Production verification did not produce a report' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce verification result
        if: steps.smoke.outcome != 'success'
        run: exit 1
